
<div class="d-flex min-vh-100 bg-light">

  <!-- Sidebar -->
  <aside class="bg-dark text-white p-3 d-flex flex-column"
         style="width: 250px;">

    <h4 class="text-center fw-bold mb-4">
      Hotel Admin
    </h4>

    <hr class="border-secondary">

    <nav class="nav flex-column gap-2">

      <a routerLink="/admin"
         [routerLinkActiveOptions]="{ exact: true }"
         routerLinkActive="active"
         class="nav-link text-white rounded px-3">
        <i class="bi bi-speedometer2 me-2"></i>
        Dashboard
      </a>

      <a routerLink="/admin/list-hotels"
         routerLinkActive="active"
         class="nav-link text-white rounded px-3">
        <i class="bi bi-buildings me-2"></i>
        List Hotels
      </a>

      <a routerLink="/admin/customers"
         routerLinkActive="active"
         class="nav-link text-white rounded px-3">
        <i class="bi bi-people me-2"></i>
        Customers
      </a>

      <a routerLink="/admin/bookings"
         routerLinkActive="active"
         class="nav-link text-white rounded px-3">
        <i class="bi bi-calendar-check me-2"></i>
        Bookings
      </a>

    </nav>

    <div class="mt-auto">
      <hr class="border-secondary">
      <button class="btn btn-outline-danger w-100 " (click)="logout()">
        <i class="bi bi-box-arrow-right me-2"></i>
        Logout
      </button>
    </div>

  </aside>

  <!-- Main Content -->
  <div class="flex-grow-1">

    <!-- Navbar -->
    <nav class="navbar bg-white shadow-sm px-4 py-3">
      <span class="navbar-brand fw-semibold">
        Admin Dashboard
      </span>

      <span class="text-secondary">
        Welcome, Admin
      </span>
    </nav>

    <!-- Child Component -->
    <main class="container-fluid p-4">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
